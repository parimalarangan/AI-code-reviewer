# nginx.conf
# ----------
# Serves the compiled React app and proxies /api/* to the FastAPI backend
# container (named "backend" in docker-compose.yml). This means the
# browser only ever talks to ONE origin in production, avoiding CORS
# entirely for end users.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any unknown path falls back to index.html so
    # client-side routing (if added later) keeps working on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
